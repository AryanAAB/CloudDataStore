server.port=${PORT:8080}

spring.application.name=cloudstore-controller
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/controller/metadata;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cluster & Replication
controller.cluster.replication-factor=${CLUSTER_REPLICATION_FACTOR:2}
controller.worker.heartbeat-timeout-seconds=${WORKER_HEARTBEAT_TIMEOUT_SECONDS:10}
controller.worker.watchdog-interval-ms=${WORKER_WATCHDOG_INTERVAL_MS:2000}
controller.worker.default-capacity-bytes=${DEFAULT_WORKER_CAPACITY_BYTES:10737418240}

# Upload Session & Buffer Limits
controller.session.ttl-seconds=${SESSION_TTL_SECONDS:600}
controller.session.buffer.max-chunks=${SESSION_BUFFER_MAX_CHUNKS:5}
controller.session.chunk-size-bytes=${CHUNK_SIZE_BYTES:1048576}

# Multipart file configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10GB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10GB}

